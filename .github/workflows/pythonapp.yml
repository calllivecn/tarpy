name: 编译+测试+条件github release
on:
  # 1. 手动触发 (推荐用于正式发布，可控性强)
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

  push:
    branches:
      #- master
      - ci
    tags:
      - 'v*'

# 在整个 workflow 中设置环境变量
env:
  # 自定义变量
  APPNAME: "tarpy"
  # 也可以引用 Contexts 或 Secrets
  #CACHE_KEY: ${{ github.sha }}


jobs:
  build-test-linux:
    name: 编译+测试 for linux
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v6

    - name: 使用action安装uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: 安装uv+启用虚拟环境
      run: |
        uv sync
        ls -lh
        echo "==================="
        uv run pyinstaller tar.spec
        echo "==================="
        ls -lh
    
    - name: 运行测试
      env:
        PYTHONUTF8: 1
        CMD_TYPE: --dist
        CWD_DIR_IN: build/
      run: uv run tests/test.py -v > tests/test-result.txt 2>&1
      # continue-on-error: true

    - name: 保存 ${{ env.APPNAME }}-${{ runner.os }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APPNAME }}-${{ runner.os }}
        path: dist/${{ env.APPNAME}}

    - name: 保存 ${{ env.APPNAME }}-${{ runner.os }}-result.txt
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APPNAME }}-${{ runner.os }}-result.txt
        path: tests/test-result.txt



  build-test-windows:
    name: 编译+测试 for windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6

    # - name: Set up Python 3.14
    #   uses: actions/setup-python@v6
    #   with:
    #     python-version: '3.14'

    - name: 使用action安装uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: 安装uv+启用虚拟环境
      run: |
        dir
        uv sync
        echo "==================="
        uv run pyinstaller tar-win.spec
        echo "==================="
        dir

    - name: 运行测试
      env:
        PYTHONUTF8: 1
        CMD_TYPE: --dist
        CWD_DIR_IN: build/
      run: uv run tests/test.py -v > tests/test-result.txt 2>&1
      # continue-on-error: true

    - name: 保存 ${{ env.APPNAME }}-${{ runner.os }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APPNAME }}-${{ runner.os }}
        path: dist/${{ env.APPNAME }}.exe

    - name: 保存 ${{ env.APPNAME }}-${{ runner.os }}-result.txt
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APPNAME }}-${{ runner.os }}-result.txt
        path: tests/test-result.txt


  github-release:
    name: 成功后人工确认后，在上传release
    runs-on: ubuntu-latest
    needs: [build-test-linux, build-test-windows]
    environment: release # ★ 触发人工审批
    # ★ 手动触发 或 推送 v 开头的 tag 时执行
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: 下载两个平台的产物(下载所有产物)
      uses: actions/download-artifact@v7
      with:
        path: artifacts/

    - name: 列出将要发布的文件
      run: |
        zip -j artifacts/tarpy-Linux.zip artifacts/${{ env.APPNAME }}-Linux/tarpy
        zip -j artifacts/tarpy-Windows.zip artifacts/${{ env.APPNAME }}-Windows/tarpy.exe
        find artifacts/ -type f -exec ls -lh {} \;

    - name: 创建 GitHub Release ${{ inputs.tag_name || github.ref_name }}
      uses: softprops/action-gh-release@v3
      with:
        # ★ 手动触发用 inputs.tag_name；推 tag 触发用 github.ref_name
        tag_name: ${{ inputs.tag_name || github.ref_name }}
        # 这里是 github release 中的 release title 字段，v1.0.0
        name: ${{ inputs.tag_name || github.ref_name }}
        generate_release_notes: true
        files: |
          artifacts/tarpy-Linux.zip
          artifacts/tarpy-Windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
