[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "tarpy"
version = "1.1.0"
description = "POXIS tar 工具 + zstd + AES加密 + sha计算 + split大文件分割"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0,<51",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22,<6.23",
]

[tool.uv]
package = false

